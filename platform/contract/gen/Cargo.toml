[package]
name = "contract-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "contract-gen"
path = "src/main.rs"

[dependencies]
contract = { path = "..", features = ["schema"] }
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
