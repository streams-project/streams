// The vocabulary: every word of the contract, and the five values every family
// carries. This file imports nothing but the options, on purpose.
//
// Why one file for all 40 enums, when the Rust has them beside the messages that
// use them: the Rust modules are mutually recursive (platform/contract/src/play.rs
// uses client::CoreMode and platform/contract/src/client.rs uses play::AttemptKind)
// and proto imports cannot be. A leaf file is the only layering that holds, and it
// is the honest one: a word is shared vocabulary, not the property of one family.
//
// Every enum here except TitleKind is OPEN. A number this build does not know is
// kept as the number, which is what `#[serde(other)] Unknown` does today with the
// word (platform/contract/src/macros.rs:21-33), except protobuf keeps the number
// and Rust keeps nothing. The zero value stands in for that unknown.
syntax = "proto3";

package contract.v1;

import "contract/constraints/v1/constraints.proto";

// ---------------------------------------------------------------------------
// Title and rating. platform/contract/src/title.rs.
// ---------------------------------------------------------------------------

// The two kinds of title. Closed on purpose: a new kind reaches old clients only
// through a dated transform, so a key always names a kind this build can open
// (platform/contract/src/title.rs:23). proto3 enums are open over numbers, so the
// closure is a refusal declared on every FIELD that carries a kind, with
// `closed: true`, and is not a property of this declaration.
enum TitleKind {
  TITLE_KIND_UNSPECIFIED = 0;
  TITLE_KIND_MOVIE = 1;
  TITLE_KIND_TV = 2;
}

// Rating words on the wire. Screens use the words like, love and dislike.
enum Rating {
  RATING_UNSPECIFIED = 0;
  RATING_DOWN = 1;
  RATING_UP = 2;
  RATING_LOVE = 3;
}

