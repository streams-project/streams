// ---------------------------------------------------------------------------
// The five values every family carries.
// ---------------------------------------------------------------------------

// `movie:<id>`, structured. The text grammar - the colon, the kind word, digits
// only, no leading zero - is gone with the text, and what survives of
// platform/contract/src/title.rs:100-110 is these two options.
//
// Which refused fixtures these two lines close: the ten bare-id and unknown-kind
// ones by `closed` (a bare id arrives as kind unset, which is the zero value, and
// `show:1` as a number the schema does not declare); TitleKey.id_zero,
// TitleKey.id_over_max and TitleKey.id_ten_digits by the bounds. The last two are
// the pair the generated Kotlin accepts today and the core refuses.
message TitleKey {
  TitleKind kind = 1 [(contract.constraints.v1.field) = {closed: true}];
  // The id is 31 bits in Rust: the top bit of a packed key holds the kind
  // (platform/contract/src/title.rs:17, MAX_TITLE_ID = 2^31-1).
  //
  // The field is uint64 ANYWAY, and this is the sharpest thing measured in this
  // package. As a uint32 it is not safe: protobuf truncates a varint that does not
  // fit the declared width, so a sender writing `tv:9999999999` - which is
  // refused/TitleKey.id_ten_digits.json, and which the generated Kotlin accepts -
  // produces a message that decodes cleanly as id 1410065407, a DIFFERENT AND VALID
  // title. Measured, not reasoned: tests/refusals.rs decodes the bytes and prost
  // returns Ok(TitleKey { kind: Tv, id: 1410065407 }). A viewer would be shown the
  // wrong film and nothing anywhere would report a fault.
  //
  // uint64 makes the illegal value REPRESENTABLE, which is the only way a bound can
  // refuse it. The varint costs the same bytes for every id that fits, so a real
  // key is not a byte larger. The cost is in the clients: protobuf-es gives
  // TypeScript a `bigint` and protoc-gen-kotlin a `Long` where uint32 gave `number`
  // and `Int`. If that is unwelcome, `[jstype = JS_STRING]` is the standard
  // mitigation; it is left off until note 204's P5 says which it wants.
  uint64 id = 2 [(contract.constraints.v1.field) = {min: 1, max: 2147483647}];
}

// One episode of a series. A film has none. Both parts are optional today.
message EpisodeRef {
  optional uint32 season = 1;
  optional uint32 episode = 2;
}

// A day of the calendar as a packed decimal: 2026-11-05 is 20261105.
//
// Why packed and not {year, month, day}: order is one integer comparison rather
// than a hand written one in four languages; one field is one check, because
// month 13 and day 32 are representable in both shapes and parts only spread the
// same single predicate over three fields; and the project already packs an
// identity into one u32 for indexes (title.rs `packed`).
//
// Two of today's refusals change here, and both are deliberate. CalendarDay.day_32
// and CalendarDay.month_13 are refused by the predicate below. CalendarDay.no_dashes
// ("20261120") STOPS being refused, because it was a refusal about text punctuation
// and there is no text: packed, it is 2026-11-20, a day the project accepts.
message CalendarDay {
  // uint64 for the reason given on TitleKey.id: a uint32 would truncate an
  // over-range varint into a plausible day instead of refusing it. The predicate
  // bounds the year at 9999, so no separate ceiling is needed.
  optional uint64 ymd = 1 [(contract.constraints.v1.field) = {
    required: true,
    value: VALUE_RULE_CALENDAR_DAY
  }];
}

// The wire version axis, same packing, a separate message so the generated type
// differs from CalendarDay's the way WireDate and CalendarDay are different
// newtypes today.
//
// No calendar-day rule here, and that is not an omission. WireDate::parse
// (platform/contract/src/version.rs:1132-1144) checks eight digits in YYYY-MM-DD
// shape and nothing else: it accepts "2026-13-01" and "9999-99-99". The WIRE_MIN
// floor lives in `VersionRange::fit`, a comparison the core makes, not a refusal
// the boundary makes. Putting either rule here would add a refusal the contract
// does not have, which the owner rule forbids.
//
// Field 1 is a varint, so "soon" cannot be put in it: refused/CoreIn.bad_date.json
// carries `"contract": "soon"` and a sender that writes a length-delimited string
// here produces bytes that fail to decode.
message ContractDate {
  // `max` is WireDate::parse's whole rule, said as a number: eight digits. Today
  // "123456789" is refused for having nine, and without this ceiling a nine digit
  // packed date would be accepted - a refusal lost by the reshape. uint64 for the
  // truncation reason given on TitleKey.id.
  optional uint64 ymd = 1 [(contract.constraints.v1.field) = {
    required: true,
    max: 99999999
  }];
}

// The wire dates a server answers. Never compared for equality.
message VersionRange {
  ContractDate min = 1 [(contract.constraints.v1.field) = {required: true}];
  ContractDate max = 2 [(contract.constraints.v1.field) = {required: true}];
}

// A map that is required even when empty needs a message of its own, because proto3
// forbids `optional` on a map field and a map has no presence. This is the whole
// answer to refused/Attempt.no_headers.json, which on a JSON-shaped schema was
// byte-identical to its valid twin: here the absence of the message is visible and
// `required` refuses it, for two bytes on the wire when it is present and empty.
message Headers {
  map<string, string> values = 1;
}

// The same, for the required text table of `/v1/strings/{lang}`.
message TextMap {
  map<string, string> values = 1;
}

// Text a client can draw with no other knowledge, including a client below the
// floor. platform/contract/src/error.rs.
message Notice {
  // Label key, for clients with the strings.
  optional string label = 1 [(contract.constraints.v1.field) = {required: true}];
  // Plain text in the viewer's language.
  optional string text = 2 [(contract.constraints.v1.field) = {required: true}];
  optional string action_label = 3;
  optional string action_address = 4;
}
