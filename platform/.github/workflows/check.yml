name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32v1-none,wasm32-unknown-unknown
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p core -p contract -p offline --target wasm32v1-none
      - run: python3 tools/ledger.py check
      - run: python3 tools/test_ledger.py
