[workspace]
resolver = "3"
members = ["contract", "contract/gen", "core", "offline", "bridges/c", "bridges/wasm", "base/net-guard", "kit/core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native libraries: release, except that a panic unwinds, so the C bridge can stop it at the boundary.
[profile.native]
inherits = "release"
panic = "unwind"
