[package]
name = "net-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The guard asks for an unencoded body, so a body that arrives encoded anyway is a surprise it has
# to decode under the cap itself rather than hand reqwest an unbounded decompressor.
[dependencies]
flate2 = "1"
reqwest.workspace = true
thiserror.workspace = true
tokio.workspace = true
