[package]
name = "bridge-c"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = ["layer"]
# Leave this out on a device with no storage. The core works alone.
layer = ["dep:offline"]

[dependencies]
core-rules = { path = "../../core", package = "core" }
offline = { path = "../../offline", optional = true }

[dev-dependencies]
contract = { path = "../../contract" }
