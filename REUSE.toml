version = 1

[[annotations]]
path = ["**", "help/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The platform contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The name and marks are the original project's own. Everything else here is open.
[[annotations]]
path = ["brand/streams/**", "apps/android/app/src/main/res/drawable-xhdpi/**", "apps/android/app/src/main/res/mipmap-xxxhdpi/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Streams project"
SPDX-License-Identifier = "LicenseRef-Brand"

# Other people's work, under its own licence.
[[annotations]]
path = "apps/web/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 Dailymotion"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["apps/web/fonts/**", "apps/android/surfaces/shared/src/main/res/font/**"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"
