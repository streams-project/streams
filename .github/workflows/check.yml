name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32v1-none,wasm32-unknown-unknown
          components: rustfmt,clippy
      - uses: astral-sh/setup-uv@v6
      - run: ./check
