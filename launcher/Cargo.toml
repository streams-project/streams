[package]
name = "launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "launcher"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
flate2 = "1"
rand.workspace = true
reqwest.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }
server-catalog = { workspace = true, features = ["sample"] }
sha2.workspace = true
tar = "0.4"
tokio.workspace = true

# Paused time, so the test that proves a program is given up on does not wait out the real waits.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
