[workspace]
resolver = "3"
members = [
    "platform/contract",
    "platform/contract/gen",
    "platform/core",
    "platform/offline",
    "platform/bridges/c",
    "platform/bridges/wasm",
    "platform/base/net-guard",
    "platform/kit/core",
    "platform/games/host",
    "platform/games/bench",
    "server/crates/*",
    "finder/service",
    "finder/open-films",
    "launcher",
    "apps/web",
    "tests/wired",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
contract = { path = "platform/contract" }
server-accounts = { path = "server/crates/server-accounts" }
server-catalog = { path = "server/crates/server-catalog" }
server-rules = { path = "server/crates/server-rules" }
server-help = { path = "server/crates/server-help" }
server-library = { path = "server/crates/server-library" }
server-pages = { path = "server/crates/server-pages" }
server-play = { path = "server/crates/server-play" }
server-api = { path = "server/crates/server-api" }

anyhow = "1"
arc-swap = "1.7"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bcrypt = "0.17"
ed25519-dalek = "2"
encoding_rs = "0.8"
half = "2.4"
hmac = "0.12"
moka = { version = "0.12", features = ["future", "sync"] }
pathfinding = "4.12"
rand = "0.9"
regex = "1"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
sqlparser = "0.59"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "compression-br", "cors", "fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
unicode-normalization = "0.1"
usearch = "2.26"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"

# The core for a browser or a TV: as small as it can be, and a panic ends the run.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native libraries: a panic unwinds, so the C bridge can stop it at the boundary.
# `strip` here does nothing for the Android app: bridge-c is a staticlib, and cargo strips linked
# artifacts, not archives, so the DWARF stays in the `.a` and the NDK linker carries it into
# libstreamscore.so. The strip that matters is Android Gradle's, which needs `ndkVersion` on the
# module that packages the library (apps/android/app/build.gradle.kts, and
# platform/tools/check_android_native.py keeps it there).
[profile.native]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
