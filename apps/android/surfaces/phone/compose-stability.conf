// Which types outside this module the toolkit may treat as stable.
//
// Every screen is handed the contract's generated classes -- a Tile, a Section, the map of words --
// and the toolkit cannot see inside them, so it calls them unstable and gives up on skipping: a tile
// recomposed whenever the page around it did, which is the one thing a row cannot afford during a
// fling. None of it is editable here: the contract's types are generated from the schema and the
// generator writes the file, so this is where the promise is made instead.
//
// It is a promise, and it holds because of how they arrive: the core decodes an answer, hands it over
// as a whole, and replaces the whole thing when it changes. Nothing in a surface writes into one.
// If that ever stops being true, a screen will miss a change and this file is the reason.

// The contract's generated types.
contract.*

// The lists, maps and sets inside them. They arrive from the decode and are replaced, never changed.
kotlin.collections.*
