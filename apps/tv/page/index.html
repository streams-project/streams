<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920" />
    <title></title>
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="tv.css" />
  </head>
  <body>
    <div id="stage">
      <div id="door" class="off">
        <header id="tabs">
          <button class="round" data-go="/" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" /></svg>
          </button>
          <button class="tab">Trending Now</button>
        </header>
        <main id="card">
          <video id="film" loop playsinline preload="auto"></video>
          <button id="help" class="link">Get Help</button>
          <div id="ask">
            <button id="sign-in" class="pill" data-go="/sign-in">Sign In</button>
            <button id="join" class="pill" data-go="/sign-in">Get Started</button>
          </div>
        </main>
        <aside id="peek"></aside>
        <video id="opening" class="done" playsinline></video>
      </div>
      <div id="notice" class="off"></div>
    </div>
    <script src="/hls.light.min.js"></script>
    <script src="ports.js"></script>
    <script src="adapters/network.js"></script>
    <script src="adapters/secrets.js"></script>
    <script src="adapters/keys.js"></script>
    <script src="adapters/player.js"></script>
    <script src="host.js"></script>
    <script src="surfaces/kit.js"></script>
    <script src="surfaces/qr.js"></script>
    <script src="surfaces/code.js"></script>
    <script src="surfaces/people.js"></script>
    <script src="surfaces/browse.js"></script>
    <script src="surfaces/title.js"></script>
    <script src="surfaces/watch.js"></script>
    <script src="surfaces/door.js"></script>
    <script src="surfaces/shell.js"></script>
  </body>
</html>
