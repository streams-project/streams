[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
contract.workspace = true
core-rules = { path = "../../platform/core", package = "core" }
offline = { path = "../../platform/offline" }
rand.workspace = true
# The workspace client and the workspace runtime, as `launcher`, `finder/service`, `net-guard` and
# `tests/wired` take them. Each carries more than this host uses - reqwest's `json`, tokio's
# `full` - and neither costs anything, because the server crates already build both that way in
# the same invocation. A narrower spelling here would be the same dependency stated twice.
reqwest.workspace = true
# Written out rather than inherited: the workspace declaration is `default-features = false` with
# `alloc` alone, which is the shape the core is in, and this host is std. Every std member in this
# repository spells it out for the same reason.
serde_json = { version = "1", features = ["std"] }
tokio.workspace = true
