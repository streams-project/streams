[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "web"
path = "src/main.rs"

[dependencies]
contract.workspace = true
core-rules = { path = "../../platform/core", package = "core" }
console_error_panic_hook = "0.1"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde_json = { version = "1", features = ["std"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Document", "Element", "EventTarget", "Headers", "History", "HtmlMediaElement", "HtmlVideoElement", "Location", "Navigator", "Performance", "PopStateEvent", "Request", "RequestInit", "Response", "Storage", "Window", "console"] }
